<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMSD Board</title>
<style>
  :root{
    --ground:#F7F3EE; --panel:#FFFFFF; --panel-2:#EFE7DC;
    --ink:#14314F; --ink-soft:#5B6B7A; --cognac:#C67A3C; --cognac-ink:#8B5628;
    --good:#3F7D5A; --warn:#C6892F; --risk:#B4472F; --line:#E2D8CA;
    --shadow:0 1px 2px rgba(20,49,79,.06),0 6px 20px rgba(20,49,79,.07); --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0E2740; --panel:#153048; --panel-2:#1B3B57; --ink:#EAF1F7; --ink-soft:#9DB2C4;
      --cognac:#E0995A; --cognac-ink:#E8A867; --good:#68B08A; --warn:#E0B15C; --risk:#E08066;
      --line:#26445e; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);line-height:1.5;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:clamp(20px,4vw,44px) 16px 64px}
  .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:700;color:var(--cognac-ink)}
  h1{font-size:clamp(26px,5vw,34px);margin:.15em 0 .1em;letter-spacing:-.02em}
  .sub{color:var(--ink-soft);font-size:14px;margin:0}
  section{margin-top:30px}
  h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-soft)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
  .q{font-weight:650;margin:0 0 4px}
  .small{font-size:12.5px;color:var(--ink-soft);word-break:break-all}
  .tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--panel-2);margin-right:6px}
  .answers{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--cognac)}
  input[type=text]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:220px;flex:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .st{font-weight:700;white-space:nowrap}
  .st-done{color:var(--good)} .st-running{color:var(--cognac-ink)} .st-ready{color:var(--good)}
  .st-blocked{color:var(--risk)} .st-unknown{color:var(--warn)} .st-waiting{color:var(--cognac-ink)}
  .tablewrap{overflow-x:auto}
  pre{white-space:pre-wrap;background:var(--panel-2);border-radius:8px;padding:10px;font-size:12.5px;margin:8px 0 0}
  .err{color:var(--risk);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">GMSD</div>
  <h1>Every project, from the disk</h1>
  <p class="sub" id="meta">Loading.</p>
  <section><h2 id="qtitle">Waiting on Jeff</h2><div id="queue"></div></section>
  <section><h2>Projects on the graph</h2><div id="projects"></div></section>
  <section><h2>Answered, waiting on the follow-up</h2><div id="answered"></div></section>
  <section><h2>Projects with no graph yet</h2><div class="card tablewrap" id="legacy"></div></section>
</div>
<script>
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stClass = (s) => 'st st-' + (s === 'waiting on Jeff' ? 'waiting' : s);

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}

function queueCard(it) {
  const needsText = it.answers.some((a) => a.label.includes('___'));
  const buttons = it.answers.map((a) => `<button data-id="${esc(it.id)}" data-choice="${a.key}">${esc(a.key)}) ${esc(a.label)}</button>`).join('');
  return `<div class="card"><p class="q">${esc(it.question)}</p>
    <div class="small"><span class="tag">${esc(it.gate)}</span>open: ${esc(it.open)}</div>
    ${it.blocks.length ? `<div class="small">blocks: ${esc(it.blocks.join(', '))}</div>` : ''}
    <div class="answers">${buttons}${needsText ? `<input type="text" data-text="${esc(it.id)}" placeholder="text for the ___">` : ''}</div>
    <div class="err" data-err="${esc(it.id)}"></div></div>`;
}

function projectCard(p) {
  if (!p.units.length) return `<div class="card"><p class="q">${esc(p.name)}</p><div class="small">Its own board: ${esc(p.links.join(', '))}. GMSD never starts or gates it.</div></div>`;
  const next = p.nextUp.unit
    ? `Next up: <b>${esc(p.nextUp.unit)}</b> <button data-start="${esc(p.slug)}" data-unit="${esc(p.nextUp.unit)}">Start it (claims it, copies the prompt)</button>`
    : `Next up: none. ${esc(p.nextUp.none)}`;
  const rows = p.units.map((u) => `<tr><td>${esc(u.id)}</td><td class="${stClass(u.status)}">${esc(u.status)}</td><td>${esc(u.owner)}</td><td class="small">${esc(u.reason)}</td></tr>`).join('');
  return `<div class="card"><p class="q">${esc(p.name)}</p><div class="small">${next}</div>
    <div data-prompt="${esc(p.slug)}"></div>
    ${p.problems.length ? `<div class="err">Graph problems: ${esc(p.problems.join('; '))}</div>` : ''}
    <div class="tablewrap"><table><tr><th>Unit</th><th>Status</th><th>Owner</th><th>Why</th></tr>${rows}</table></div></div>`;
}

function answeredCard(it) {
  const follow = it.answer.followUp ? `<pre>${esc(it.answer.followUp)}</pre>` : '';
  return `<div class="card"><p class="q">${esc(it.question)}</p><div class="small">You answered ${esc(it.answer.choice)}) ${esc(it.answer.label)} ${esc(it.answer.text)} on ${esc(it.answer.on)}</div>${follow}</div>`;
}

async function load() {
  const board = await (await fetch('/api/board')).json();
  document.getElementById('meta').textContent = `Built from disk at ${new Date(board.generated).toLocaleString()}. Nothing here is typed.`;
  document.getElementById('qtitle').textContent = `Waiting on Jeff (${board.queue.open.length})`;
  document.getElementById('queue').innerHTML = board.queue.open.map(queueCard).join('') || '<div class="card small">Nothing is waiting on you.</div>';
  document.getElementById('projects').innerHTML = board.projects.map(projectCard).join('');
  document.getElementById('answered').innerHTML = board.queue.answered.map(answeredCard).join('') || '<div class="card small">None.</div>';
  const legacy = board.legacy.map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.cardUpdated)}</td><td class="small">${esc(c.folder)}</td></tr>`).join('');
  document.getElementById('legacy').innerHTML = `<table><tr><th>Project</th><th>Card last edited</th><th>Folder</th></tr>${legacy}</table>`;
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.choice) {
    const box = document.querySelector(`[data-text="${CSS.escape(b.dataset.id)}"]`);
    const out = await post('/api/answer', { id: b.dataset.id, choice: b.dataset.choice, text: box ? box.value : '' });
    if (!out.ok) { document.querySelector(`[data-err="${CSS.escape(b.dataset.id)}"]`).textContent = out.error; return; }
    load();
  }
  if (b.dataset.start) {
    const out = await post('/api/start', { slug: b.dataset.start, unit: b.dataset.unit });
    const slot = document.querySelector(`[data-prompt="${CSS.escape(b.dataset.start)}"]`);
    if (!out.ok) { slot.innerHTML = `<div class="err">${esc(out.refusals.map((r) => r.rule + ': ' + r.message).join(' | '))}</div>`; return; }
    try { await navigator.clipboard.writeText(out.prompt); } catch {}
    slot.innerHTML = `<pre>${esc(out.prompt)}</pre><div class="small">Copied. Paste it into a new chat.</div>`;
  }
});

load();
</script>
</body>
</html>
